<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COE Chat</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root { --loader-bg: #eff1f5; --loader-text: #4c4f69; }
      [data-theme="latte"] { --loader-bg: #eff1f5; --loader-text: #4c4f69; }
      [data-theme="mocha"] { --loader-bg: #1e1e2e; --loader-text: #cdd6f4; }
      [data-theme="frappe"] { --loader-bg: #303446; --loader-text: #c6d0f5; }
      [data-theme="macchiato"] { --loader-bg: #24273a; --loader-text: #c6d0f5; }
      [data-theme="light"] { --loader-bg: #ffffff; --loader-text: #000000; }
      [data-theme="dark"] { --loader-bg: #171b1d; --loader-text: #ffffff; }
      body { background: var(--loader-bg); margin: 0; }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: var(--loader-bg);
        opacity: 1;
        transition: opacity 0.35s ease;
        pointer-events: auto;
        will-change: opacity;
      }
      #loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loader-icon {
        position: absolute;
        width: 128px;
        height: 128px;
        will-change: left, top, transform;
      }
      #loader-icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #loader-text {
        position: absolute;
        left: 50%;
        bottom: 28%;
        transform: translateX(-50%);
        font-family: 'GoogleSansCodeNF', system-ui, monospace;
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        opacity: 0.7;
        color: var(--loader-text);
      }
    </style>
    <script>
      (function() {
        var theme = localStorage.getItem('coe-chat-theme') || 'latte';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="loader">
      <div id="loader-icon">
        <img src="https://raw.githubusercontent.com/lcsmalls/COE-Chat/main/favicon.png" alt="Loading COE Chat" />
      </div>
      <div id="loader-text">loading</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script nonce="loader">
      (function() {
        var icon = document.getElementById('loader-icon');
        var startTime = null;
        var dropDone = false;

        var A = 7;
        var yFloor = 47;
        var H = 10;
        var R = 30;
        var dropMs = 250;
        var period = 1000;

        function frame(now) {
          if (!startTime) startTime = now;
          var elapsed = now - startTime;

          if (!dropDone) {
            var dt = Math.min(elapsed / dropMs, 1);
            var ease = dt * dt;
            var x = 50 + (43 - 50) * ease;
            var y = 37 + (yFloor - 37) * ease;
            var rot = R / A * (x - 50);
            icon.style.left = x + '%';
            icon.style.top = y + '%';
            icon.style.transform = 'translate(-50%, -50%) rotate(' + rot + 'deg)';
            if (dt >= 1) {
              dropDone = true;
              startTime = now;
            }
            requestAnimationFrame(frame);
            return;
          }

          var theta = (elapsed % period) / period * 2 * Math.PI;
          var t = theta / Math.PI - Math.floor(theta / Math.PI);

          var x = 50 - A * Math.cos(theta);
          var yPos = yFloor - 4 * H * t * (1 - t);
          var rot = R / A * (x - 50);

          icon.style.left = x + '%';
          icon.style.top = yPos + '%';
          icon.style.transform = 'translate(-50%, -50%) rotate(' + rot + 'deg)';
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
    </script>
    <script src="public/debug-console.js" defer></script>
  </body>
</html>
