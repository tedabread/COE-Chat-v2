<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoogleSansCodeNF Character Browser</title>
<style>
  @font-face {
    font-family: 'GoogleSansCodeNF';
    src: url('./public/fonts/GoogleSansCodeNF-Regular.ttf') format('truetype');
  }
  body {
    font-family: 'GoogleSansCodeNF', monospace;
    background: #1e1e2e;
    color: #cdd6f4;
    margin: 0;
    padding: 1rem;
  }
  h1 { font-size: 1.2rem; margin-bottom: 0.5rem; }
  .info { font-size: 0.85rem; color: #a6adc8; margin-bottom: 1rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(16, 1fr);
    gap: 2px;
    max-width: 100%;
  }
  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.3rem;
    font-size: 1.2rem;
    background: #313244;
    border-radius: 4px;
    min-height: 4rem;
    cursor: pointer;
    transition: background 0.1s;
    position: relative;
  }
  .cell:hover {
    background: #45475a;
  }
  .cell .code {
    font-size: 0.55rem;
    color: #6c7086;
    margin-top: 0.2rem;
  }
  .cell.missing {
    opacity: 0.15;
  }
  .cell.highlight {
    background: #f38ba8;
    color: #1e1e2e;
  }
  .cell.highlight .code {
    color: #1e1e2e;
    font-weight: 700;
  }
  .section {
    margin-top: 1.5rem;
    font-size: 0.95rem;
    font-weight: 600;
    color: #89b4fa;
    padding: 0.3rem 0;
    border-bottom: 1px solid #45475a;
  }
  input[type="text"] {
    background: #313244;
    border: 1px solid #45475a;
    color: #cdd6f4;
    padding: 0.4rem 0.6rem;
    border-radius: 4px;
    font-family: 'GoogleSansCodeNF', monospace;
    font-size: 0.9rem;
    width: 200px;
    margin-bottom: 1rem;
  }
  input[type="text"]::placeholder { color: #6c7086; }
  .selected-info {
    margin-top: 0.5rem;
    font-size: 0.9rem;
    background: #313244;
    padding: 0.5rem;
    border-radius: 4px;
    display: none;
  }
  .selected-info.show { display: block; }
  .selected-info .char { font-size: 2rem; }
</style>
</head>
<body>
<h1>GoogleSansCodeNF Nerd Font — Character Browser</h1>
<div class="info">Hover a cell to see the code. Click to copy CSS-safe escape. Ranges: U+E000–U+F8FF (PUA), U+F0000–U+FFFFF (Supplementary PUA). The reply icon I tried was <strong>U+F3E5</strong> — highlighted in red if present.</div>

<input type="text" id="search" placeholder="Code point search (e.g. F3E5, 1F5D8)" />

<div id="selected" class="selected-info"></div>

<div id="grid"></div>

<script>
const grid = document.getElementById('grid');
const search = document.getElementById('search');
const selected = document.getElementById('selected');

const ranges = [
  { start: 0xE000, end: 0xF8FF, label: 'Private Use Area (U+E000–U+F8FF)' },
  { start: 0xF0000, end: 0xFFFFF, label: 'Supplementary PUA-A (U+F0000–U+FFFFF)' },
  { start: 0x100000, end: 0x10FFFF, label: 'Supplementary PUA-B (U+100000–U+10FFFF)' },
];

function renderRange(range) {
  const section = document.createElement('div');
  section.className = 'section';
  section.textContent = range.label;
  grid.appendChild(section);

  const row = document.createElement('div');
  row.className = 'grid';

  for (let cp = range.start; cp <= range.end; cp++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.cp = cp;

    const span = document.createElement('span');
    span.textContent = String.fromCodePoint(cp);
    cell.appendChild(span);

    const code = document.createElement('div');
    code.className = 'code';
    code.textContent = 'U+' + cp.toString(16).toUpperCase();
    cell.appendChild(code);

    if (cp === 0xF3E5) {
      cell.classList.add('highlight');
      cell.title = '← This is U+F3E5 (reply)';
    }

    cell.addEventListener('click', () => {
      const hex = cp.toString(16).toUpperCase();
      const esc = '\\u' + hex;
      selected.classList.add('show');
      selected.innerHTML = `
        <div class="char">${String.fromCodePoint(cp)}</div>
        <div>Unicode: U+${hex}</div>
        <div>CSS: <code>${esc}</code></div>
        <div>JS: <code>'\\u${hex}'</code></div>
        <div>TSX: <code>{'\\u${hex}'}</code></div>
        <button onclick="navigator.clipboard.writeText('\\\\u${hex}')">Copy CSS escape</button>
      `;
    });

    row.appendChild(cell);
  }

  grid.appendChild(row);
}

ranges.forEach(r => {
  const startTime = performance.now();
  renderRange(r);
  console.log(`Rendered ${r.label} in ${(performance.now() - startTime).toFixed(0)}ms`);
});

search.addEventListener('input', () => {
  const val = search.value.trim().toLowerCase();
  document.querySelectorAll('.cell').forEach(cell => {
    const cp = parseInt(cell.dataset.cp);
    const hex = cp.toString(16).toLowerCase();
    cell.style.display = (!val || hex.includes(val)) ? '' : 'none';
  });
});
</script>
</body>
</html>
